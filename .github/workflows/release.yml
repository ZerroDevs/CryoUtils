name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryoutils-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate VERSION
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain exactly three numeric parts."
          }

          $tag = "v$version"
          git fetch --tags --force
          $skip = "false"
          if (@(git tag --list "$tag").Count -gt 0) {
            $skip = "true"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$skip" >> $env:GITHUB_OUTPUT

          if ($skip -eq "true") {
            Write-Host "Tag $tag already exists. This run will not publish a release."
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore CryoUtils.csproj

      - name: Build
        shell: pwsh
        run: dotnet build CryoUtils.csproj -c Release --no-restore

      - name: Publish Full Offline and Lite Windows builds
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish CryoUtils.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            "-p:Version=$version" `
            -o publish\win-x64

          dotnet publish CryoUtils.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            "-p:Version=$version" `
            -o publish\win-x64-lite

      - name: Sign app executables
        if: steps.version.outputs.skip != 'true' && env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "CryoUtils-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -Filter signtool.exe `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object {
              if ($_.FullName -match '\\(\d+\.\d+\.\d+\.\d+)\\') { [version]$Matches[1] } else { [version]'0.0.0.0' }
            } -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found. Install the Windows SDK signing tools."
          }

          foreach ($target in @("publish\win-x64\CryoUtils.exe", "publish\win-x64-lite\CryoUtils.exe")) {
            & $signtool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $pfxPath `
              /p $env:SIGNING_PFX_PASSWORD `
              $target

            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne "Valid") {
              throw "$target signature verification failed: $($signature.Status)."
            }
          }

          Remove-Item -LiteralPath $pfxPath -Force

      - name: Build Full Offline and Lite Inno Setup installers
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "ISCC.exe (Inno Setup 6.3 or newer) could not be found."
          }

          foreach ($variant in @("Full", "Lite")) {
            & $iscc "/DAppVersion=$version" "/DVariant=$variant" Installer\CryoUtils.iss
            if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation ($variant) failed with exit code $LASTEXITCODE."
            }
          }

      - name: Sign installers
        if: steps.version.outputs.skip != 'true' && env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pfxPath = Join-Path $env:RUNNER_TEMP "CryoUtils-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse `
            -Filter signtool.exe `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object {
              if ($_.FullName -match '\\(\d+\.\d+\.\d+\.\d+)\\') { [version]$Matches[1] } else { [version]'0.0.0.0' }
            } -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found. Install the Windows SDK signing tools."
          }

          foreach ($target in @(
            "Installer\Output\CryoUtils-Setup-$version.exe",
            "Installer\Output\CryoUtils-Lite-Setup-$version.exe"
          )) {
            & $signtool.FullName sign `
              /fd SHA256 `
              /td SHA256 `
              /tr http://timestamp.digicert.com `
              /f $pfxPath `
              /p $env:SIGNING_PFX_PASSWORD `
              $target

            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne "Valid") {
              throw "$target signature verification failed: $($signature.Status)."
            }
          }

          Remove-Item -LiteralPath $pfxPath -Force

      - name: Warn when signing is not configured
        if: steps.version.outputs.skip != 'true' && env.SIGNING_PFX_BASE64 == ''
        shell: pwsh
        run: Write-Warning "Signing secrets are not configured. Publishing unsigned assets with SHA-256 verification."

      - name: Build release packages and checksums
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $setupName = "CryoUtils-Setup-$version.exe"
          $zipName = "CryoUtils-$version-win-x64.zip"
          $liteSetupName = "CryoUtils-Lite-Setup-$version.exe"
          $liteZipName = "CryoUtils-Lite-$version-win-x64.zip"
          New-Item -ItemType Directory -Path release -Force | Out-Null

          Copy-Item -LiteralPath "Installer\Output\$setupName" -Destination "release\$setupName" -Force
          Copy-Item -LiteralPath "Installer\Output\$liteSetupName" -Destination "release\$liteSetupName" -Force
          Compress-Archive -Path "publish\win-x64\*" -DestinationPath "release\$zipName" -Force
          Compress-Archive -Path "publish\win-x64-lite\*" -DestinationPath "release\$liteZipName" -Force

          foreach ($artifact in @($setupName, $zipName, $liteSetupName, $liteZipName)) {
            $hash = (Get-FileHash -LiteralPath "release\$artifact" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $artifact" | Set-Content -LiteralPath "release\$artifact.sha256" -Encoding ascii
          }

          $previousTag = ""
          try {
            $previousTag = (git describe --tags --abbrev=0 2>$null).Trim()
          } catch {
          }
          if ($previousTag -eq $tag) {
            try {
              $previousTag = (git describe --tags --abbrev=0 "HEAD^" 2>$null).Trim()
            } catch {
              $previousTag = ""
            }
          }

          $range = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }
          $commits = @(git log $range --no-merges --pretty=format:"- %s")
          $commits = $commits | ForEach-Object { $_ -replace "—", "-" }
          if ($commits.Count -eq 0) {
            $commits = @("- No code changes recorded.")
          }

          $notes = @(
            "# CryoUtils $tag",
            "",
            "## Changes",
            "",
            ($commits -join "`n"),
            "",
            "## Download",
            "",
            "- **Lite Installer (Recommended — smallest download, ~3.4 MB installed):** Download ``$liteSetupName`` (``$liteSetupName.sha256``). Installs per-user into ``%LOCALAPPDATA%\Programs\CryoUtils`` and automatically installs .NET 10 Desktop Runtime (x64) if not already present.",
            "- **Full Offline Installer (No internet needed after download):** Download ``$setupName`` (``$setupName.sha256``). Works immediately without downloading any runtime.",
            "- **Portable Zip (Full Offline):** Download ``$zipName`` (``$zipName.sha256``), extract, and run ``CryoUtils.exe``.",
            "- **Portable Zip (Lite, requires .NET 10 Desktop Runtime x64):** Download ``$liteZipName`` (``$liteZipName.sha256``), extract, and run ``CryoUtils.exe``."
          ) -join "`n"

          Set-Content -LiteralPath "release\notes.md" -Value $notes -Encoding utf8

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $setupName = "CryoUtils-Setup-$version.exe"
          $zipName = "CryoUtils-$version-win-x64.zip"
          $liteSetupName = "CryoUtils-Lite-Setup-$version.exe"
          $liteZipName = "CryoUtils-Lite-$version-win-x64.zip"

          $arguments = @(
            "release", "create", $tag,
            "release\$liteSetupName",
            "release\$liteSetupName.sha256",
            "release\$setupName",
            "release\$setupName.sha256",
            "release\$zipName",
            "release\$zipName.sha256",
            "release\$liteZipName",
            "release\$liteZipName.sha256",
            "--title", "CryoUtils $tag",
            "--notes-file", "release\notes.md"
          )
          gh @arguments
